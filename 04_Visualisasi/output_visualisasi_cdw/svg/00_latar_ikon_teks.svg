  <g id="text_1">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233044" x="15.84" y="30.277031" transform="rotate(-0 15.84 30.277031)">Di balik angka, ada perjalanan</text>
  </g>
  <g id="text_2">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #627080" x="15.84" y="54.058359" transform="rotate(-0 15.84 54.058359)">Sama-Sama Kuliah, Tak Sama Bebannya</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e8710a" x="145.44" y="231.552" transform="rotate(-0 145.44 231.552)">Titik berangkat</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(46.956484 267.029312)">Generasi pertama: kedua orang tua</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(41.789922 283.529312)">belum pernah menempuh pendidikan</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(128.011016 300.029312)">tinggi.</text>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b3a5f" x="417.6" y="231.552" transform="rotate(-0 417.6 231.552)">Kondisi perjalanan</text>
  </g>
  <g id="text_6">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(337.999531 267.029312)">Ekonomi, aktivitas kerja, dan</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(334.825859 283.529312)">dukungan keluarga menyertai</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(346.544297 300.029312)">kebutuhan yang berbeda.</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e8b57" x="689.76" y="231.552" transform="rotate(-0 689.76 231.552)">Membaca capaian</text>
  </g>
  <g id="text_8">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(590.348359 267.029312)">Pahami hasil yang tercatat bersama</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(609.285547 283.529312)">titik awal dan perkembangan</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #233044" transform="translate(657.301406 301.094937)">mahasiswa.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #627080" x="15.84" y="371.066672" transform="rotate(-0 15.84 371.066672)">Latar konseptual; ikon bukan ukuran data.</text>
  </g>
  <g id="text_10">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #627080" x="15.84" y="381.233325" transform="rotate(-0 15.84 381.233325)">Sumber: lima CSV CDW 2026. Data fiktif; unit analisis mahasiswa.</text>
